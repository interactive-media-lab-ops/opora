[project]
name = "opora-backend"
version = "0.1.0"
description = "OPORA — HR-платформа оцінки кандидатів (бекенд)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.17",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "anthropic>=0.40",
    "openai>=1.57",
    "greenlet>=3.1",
    "email-validator>=2.3.0",
    "openpyxl>=3.1",
    "pyotp>=2.9",
    "cryptography>=43",
    "fpdf2>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "pypdf>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Depends(...) у параметрах — ідіома FastAPI
    "E501",  # довжину рядків тримає форматер
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # фікстури pytest навмисно перекривають імена
